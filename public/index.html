<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tontine Manager</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body class="dashboard-layout">

    <aside class="sidebar">
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
            <h2>TONTINE MANAGER</h2>
            <i class='bx bx-analyse' style='font-size: 24px; color: var(--color-primary);'></i>
        </div>
        <nav>
            <ul>
    <li><a href="/public/index.html"><i class='bx bx-grid-alt'></i> Dashboard</a></li>
    <li><a href="/public/members.html"><i class='bx bx-user'></i> Membres</a></li>
    <li><a href="/public/cycles.html"><i class='bx bx-refresh'></i> Cycles</a></li>
    <li><a href="/public/groups.html"><i class='bx bx-group'></i> Groupes</a></li>
    <li><a href="/public/contributions.html"><i class='bx bx-money'></i> Cotisations</a></li>
</ul>
        </nav>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div class="header-title">
                <button id="btn-menu-mobile" class="menu-toggle"><i class='bx bx-menu'></i></button>
                <div>
                    <h1>Tableau de Bord</h1>
                    <p>Vue d'ensemble de l'activité de vos tontines...</p>
                </div>
            </div>
        </header>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; width: 100%; max-width: 1200px; margin-top: 20px;">
            
            <div style="background: var(--bg-card); padding: 25px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); min-width: 0; position: relative;">
                <h3 style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px; text-transform: uppercase;">Membres Totaux</h3>
                <p id="stat-membres" style="font-size: 32px; font-weight: bold; color: var(--text-dark);">0</p>
                <i class='bx bx-user-check' style='position: absolute; right: 20px; bottom: 20px; font-size: 36px; color: var(--text-muted); opacity: 0.3;'></i>
            </div>

            <div style="background: var(--bg-card); padding: 25px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); min-width: 0; position: relative;">
                <h3 style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px; text-transform: uppercase;">Argent en Caisse</h3>
                <p id="stat-caisse" style="font-size: 32px; font-weight: bold; color: #2ECC71;">0 FCFA</p>
                <i class='bx bx-wallet' style='position: absolute; right: 20px; bottom: 20px; font-size: 36px; color: #2ECC71; opacity: 0.3;'></i>
            </div>

            <div style="background: var(--bg-card); padding: 25px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); min-width: 0; position: relative;">
                <h3 style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px; text-transform: uppercase;">Cycles Terminés</h3>
                <p id="stat-cycles" style="font-size: 32px; font-weight: bold; color: var(--color-primary);">0</p>
                <i class='bx bx-check-circle' style='position: absolute; right: 20px; bottom: 20px; font-size: 36px; color: var(--color-primary); opacity: 0.3;'></i>
            </div>

        </div>
    </main>
<script type="module" src="/public/js/contributions.js"></script>

<script type="module" src="./js/contributions.js"></script>
    <script type="module" src="/public/js/dashboard.js"></script>
</body>
</html>
